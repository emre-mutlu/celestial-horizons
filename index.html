<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona Generator | Algorithmic Avatars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <canvas id="artCanvas"></canvas>
        
        <div class="controls-overlay">
            <header>
                <h1 id="appTitle">Celestial Horizons</h1>
                <p id="appSubtitle">Algorithmic Art Engine</p>
            </header>

            <section class="control-group">
                <label>Generator Mode</label>
                <div class="mode-toggle">
                    <label class="mode-btn mode-horizon">
                        <input type="radio" name="genMode" value="horizon" checked> 
                        <span>Horizon</span>
                    </label>
                    <label class="mode-btn mode-persona">
                        <input type="radio" name="genMode" value="persona"> 
                        <span>Persona</span>
                    </label>
                </div>
            </section>

            <section class="control-group">
                <label id="paletteLabel">Atmosphere Palette</label>
                <div id="paletteList" class="palette-grid">
                    <!-- Palettes will be injected here -->
                </div>
            </section>

            <footer>
                <section class="control-group" style="margin-bottom: 0.5rem;">
                    <label for="seedInput" id="seedLabel" style="font-size: 0.65rem;">Universe Seed</label>
                    <div class="input-wrapper">
                        <input type="text" id="seedInput" placeholder="Enter a seed..." style="padding: 0.5rem; font-size: 0.75rem;">
                        <button type="button" id="randomSeedBtn" title="Randomize Seed" style="width: 32px; height: 32px;">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                        </button>
                    </div>
                </section>

                <div style="display: flex; gap: 0.5rem;">
                    <button type="button" id="generateBtn" class="primary-btn" style="flex: 1;">Generate Horizon</button>
                    <button type="button" id="downloadBtn" class="secondary-btn" style="flex: 0 0 auto; width: 50px; padding: 0;" title="Save Artwork">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>
                </div>
            </footer>
        </div>

        <div id="toast" class="toast">Image Saved!</div>
    </main>

    <script src="script.js"></script>
</body>
</html>
